<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Michael Nevins, technical designer and multi-disciplinary game developer."
    />
    <title>Michael Nevins - Portfolio</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved or system theme before first paint, so dark visitors never see a light flash.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (error) {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
