<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Michael Nevins, game developer and founder of DREAMATRON, building AI tools and an engine for the next generation of games."
    />
    <title>Michael Nevins - Portfolio</title>
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the theme before first paint: dark unless the visitor chose light.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (error) {}
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
